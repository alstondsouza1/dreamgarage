<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DreamGarage</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  >

  <link rel="stylesheet" href="/style.css">

  <script defer src="/scripts/cars.js"></script>
</head>

<body>

  <header class="site-header">
    <nav class="container">

      <a href="/" class="logo">
        DreamGarage
      </a>

      <ul>
        <li>
          <a href="/">Home</a>
        </li>
      </ul>

    </nav>
  </header>

  <main>

    <section class="hero">

      <div class="container">

        <p class="hero-label">
          PERFORMANCE CARS
        </p>

        <h1>DreamGarage</h1>

        <p class="hero-description">
          Explore some of the world's most iconic performance cars.
        </p>

        <a href="#cars" role="button">
          Explore Cars
        </a>

      </div>

    </section>


    <section id="cars" class="cars-section">

      <div class="container">

        <div class="section-heading">

          <p class="section-label">
            THE COLLECTION
          </p>

          <h2>
            Choose Your Dream Car
          </h2>

          <p>
            Discover legendary performance cars from around the world.
          </p>

        </div>

        <div id="cars-container" class="cars-grid"></div>

      </div>

    </section>

  </main>


  <footer class="site-footer">

    <div class="container">

      <p>DreamGarage</p>

      <small>
        Explore. Discover. Drive.
      </small>

    </div>

  </footer>

</body>

</html>
